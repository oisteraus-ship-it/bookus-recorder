<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BOOKUS 대출·반납 스캔</title>
<style>
  :root{ --navy:#16233f; --gold:#b88a2b; --cream:#fdfaf3; --cream2:#f4ecdd; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       background:linear-gradient(160deg,#fdfaf3 0%,#f4ecdd 58%,#efe6d4 100%);color:#243244;
       display:flex;flex-direction:column;min-height:100%}
  header{padding:12px 16px;background:rgba(255,255,255,.72);border-bottom:1px solid #e6dcc4;
         display:flex;align-items:center;gap:10px}
  header .ttl{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:1.15rem;color:var(--navy);letter-spacing:.03em}
  header .ttl .g{color:var(--gold)}
  header .mode{margin-left:auto;font-size:.82rem;font-weight:800;padding:5px 11px;border-radius:999px;background:#eef1f6;color:var(--navy)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
  .stage{width:min(88vw,460px)}
  .vidwrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#000;border:1px solid #e6dcc4}
  video{width:100%;height:100%;object-fit:cover;background:#000}
  .reticle{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.22);pointer-events:none}
  .msg{margin-top:14px;font-size:1.02rem;color:#6b5f44;min-height:1.4em;line-height:1.45}
  .fb{margin-top:12px;border-radius:14px;padding:16px 14px;display:none;border:1px solid #e6dcc4;background:#fffdf8}
  .fb.show{display:block}
  .fb .ic{font-size:2.6rem;line-height:1}
  .fb .big{font-size:1.5rem;font-weight:900;margin-top:4px;color:#1f2d45;word-break:keep-all}
  .fb .sub{font-size:.98rem;color:#6b5f44;margin-top:4px;line-height:1.45;word-break:keep-all}
  .fb.ok{background:rgba(16,122,96,.10)} .fb.ok .big{color:#0f766e}
  .fb.ret{background:rgba(14,116,170,.10)} .fb.ret .big{color:#0e74aa}
  .fb.err{background:rgba(180,55,46,.09)} .fb.err .big{color:#b4372e}
  .fb.warn{background:rgba(180,120,20,.10)} .fb.warn .big{color:#a9741a}
  .btns{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{font-family:inherit;padding:12px 18px;border-radius:11px;font-size:1rem;font-weight:800;cursor:pointer;border:1px solid #d7c8a6}
  .retry{background:#16233f;border-color:#16233f;color:#fff;display:none}
  .retry.show{display:inline-block}
  .close{background:#fff;color:#5b4e34}
  footer{padding:10px 16px;background:rgba(255,255,255,.72);border-top:1px solid #e6dcc4;text-align:center;font-size:.82rem;color:#8a7b57;font-weight:700}
  canvas{display:none}
</style>
</head>
<body>
  <header>
    <div class="ttl">BOOKUS <span class="g">스캔</span></div>
    <div class="mode" id="modeBadge">자동</div>
  </header>
  <main>
    <div class="stage">
      <div class="vidwrap">
        <video id="vid" playsinline muted></video>
        <div class="reticle"></div>
      </div>
      <div class="msg" id="msg">카메라를 켜는 중…</div>
      <div class="fb" id="fb"><div class="ic" id="fbIc"></div><div class="big" id="fbBig"></div><div class="sub" id="fbSub"></div></div>
      <div class="btns">
        <button class="retry" id="retry">📷 카메라 다시 켜기</button>
        <button class="close" id="close">✕ 닫기</button>
      </div>
    </div>
  </main>
  <footer>QR을 네모 칸 안에 비추면 자동으로 인식됩니다 · 북커스 영어 원서 학원</footer>
  <canvas id="cv"></canvas>

      var u=new SpeechSynthesisUtterance(String(t)); u.lang='ko-KR'; if(_koVoice)u.voice=_koVoice; u.rate=1; u.pitch=1;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }catch(e){}
  }
  /* 한국어 음성을 '내장 MP3'로 재생 — 삑 소리와 같은 WebAudio 경로라 기기 TTS·인터넷과 무관하게 작동.
     내장 재생이 어떤 이유로 안 되면 기기 TTS(speak)로 폴백. */
  var VOICE_BUFFERS={}, _vUnlocked=false;
  function clipCtx(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); return audio; }catch(e){ return null; } }
  function b64buf(durl){ try{ var s=String(durl).split(',')[1]; var bin=atob(s); var n=bin.length; var u=new Uint8Array(n); for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i); return u.buffer; }catch(e){ return null; } }
  function playBuf(ctx,buf){ try{ var s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.start(0); }catch(e){} }
  function hasClip(k){ return !!(k && typeof VOICE_CLIPS!=='undefined' && VOICE_CLIPS && VOICE_CLIPS[k]); }
  function getBuf(key, cb){
    try{
      if(VOICE_BUFFERS[key]){ cb(VOICE_BUFFERS[key]); return; }
      var durl=hasClip(key)?VOICE_CLIPS[key]:null; var ctx=clipCtx(); var ab=durl?b64buf(durl):null;
      if(!durl || !ctx || !ab){ cb(null); return; }
      try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
      ctx.decodeAudioData(ab, function(b){ VOICE_BUFFERS[key]=b; cb(b); }, function(){ cb(null); });
    }catch(e){ cb(null); }
  }
  /* 여러 클립을 순서대로 이어 재생 (예: 대출 완료 → 대출기간 안내) */
  function playSeq(keys, fallbackText){
    var ctx=clipCtx(); keys=(keys||[]).filter(hasClip);
    if(!ctx || !keys.length){ if(fallbackText)speak(fallbackText); return; }
    try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
    var i=0;
    (function next(){
      if(i>=keys.length) return;
      getBuf(keys[i++], function(buf){
        if(!buf){ next(); return; }
        try{ var s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.onended=function(){ next(); }; s.start(0); }
        catch(e){ next(); }
      });
    })();
  }
  function playClip(key, fallbackText){ playSeq([key], fallbackText); }
  function voiceUnlock(){ try{ if(_vUnlocked)return; _vUnlocked=true; var ctx=clipCtx(); if(ctx && ctx.state==='suspended') ctx.resume(); }catch(e){} }
  function beep(type){
    try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      var o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination);
      o.type='sine'; o.frequency.value=(type==='ok'?880:(type==='warn'?600:(type==='err'?300:760))); g.gain.value=0.07; o.start();
      setTimeout(function(){ try{o.stop();}catch(e){} }, type==='err'?260:140);
    }catch(e){}
  }

  /* ── opener(관리자앱 키오스크)와의 통신 ───────────────────────────── */
  function toOpener(obj){ try{ if(window.opener && !window.opener.closed) window.opener.postMessage(obj,'*'); }catch(e){} }
  // 키오스크는 샌드박스(불투명 출처 "null")라 origin으로는 검증 불가 → opener 동일성으로 확인
  window.addEventListener('message',function(e){
    if(e.source!==window.opener) return;
    var d=e.data||{};
    if(d.type==='SCAN_INIT' || d.type==='SCAN_MODE'){
      var m=String(d.mode||'auto');
      $('modeBadge').textContent=(m==='loan'?'📕 대출':(m==='return'?'📗 반납':'🔄 자동'))+(d.borrower?(' · '+d.borrower):'');
    } else if(d.type==='SCAN_FEEDBACK'){
      // 키오스크가 서버 처리 결과를 보내옴 → 표시 + 효과음 + 음성
      showFb(d.cls||'', d.icon||'', d.big||'', d.sub||'');
      var c=d.cls||'', big=String(d.big||''), days=Number(d.days||0);
      beep(c==='ok'||c==='ret'?'ok':(c==='warn'?'warn':(c==='err'?'err':'ok')));
      if(d.nov){
        // 화면 전용(학생 확인 시 연체·대출중 안내) — 음성 없음, 목록 읽을 수 있게 더 오래 표시
        setTimeout(hideFb, 6500);
      } else {
        // 음성: 받은 피드백 내용으로 바로 판단(삑이 울리는 그 메시지라 안정적 — admin 재배포와 무관)
        var seq=[], say='';
        if(big.indexOf('반납 완료')>=0 || c==='ret'){ seq=['return']; say='반납 완료되었습니다'; }
        else if(big.indexOf('대출 완료')>=0 || big.indexOf('대출되었')>=0){
          seq=['loan']; say='대출 완료되었습니다';
          var pk={3:'p3',5:'p5',7:'p7',14:'p14'}[days];
          if(pk){ seq.push(pk); say+='. 대출기간은 '+days+'일입니다'; }
          if(Number(d.overdue||0)>0){ seq.push('overdue'); say+='. 연체된 책이 있습니다. 먼저 반납해 주세요'; }
          if(Number(d.active||0)>0){ seq.push('active'); say+='. 대출 중인 책이 있습니다'; }
        }
        else if(big.indexOf('이미 대출 중')>=0){ seq=['blocked']; say='이미 대출 중입니다'; }
        else if(big.indexOf('학생을 먼저')>=0){ seq=['need']; say='학생을 먼저 선택하세요'; }
        else if(big.indexOf('대출 기록 없음')>=0){ seq=['notloaned']; say='대출 중인 책이 아닙니다'; }
        else if(big.indexOf('학생을 찾을 수 없')>=0){ seq=['nostudent']; say='등록되지 않은 학생입니다'; }
        else if(big.indexOf('인식할 수 없')>=0){ seq=['badcode']; say='인식할 수 없는 코드입니다'; }
        else if(big.indexOf('대출자:')>=0){ seq=['cfm']; say='학생이 확인되었습니다'; }
        if(seq.length) playSeq(seq, say);
        setTimeout(hideFb, (seq.indexOf('overdue')>=0||seq.indexOf('active')>=0)?6500:3500);
      }
    } else if(d.type==='SCAN_SAY'){
      /* 구버전 admin 호환: 위 피드백에서 이미 음성 처리하므로 중복 방지 위해 무시 */
    }
  });

  /* ── 카메라 ───────────────────────────────────────────────────────── */
  function loadJsQR(cb){ cb(window.jsQR?undefined:new Error('스캔 라이브러리를 불러올 수 없습니다.')); }
  function startCam(){
    hideFb(); $('retry').className='retry'; setMsg('카메라를 켜는 중…');
    loadJsQR(function(err){
      if(err){ setMsg(err.message); $('retry').className='retry show'; return; }
      if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
        setMsg('이 브라우저는 카메라를 지원하지 않습니다.'); return;
      }
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(s){
        stream=s; vid.srcObject=s; vid.setAttribute('playsinline','');
        var p=vid.play(); if(p&&p.catch)p.catch(function(){});
        setMsg('QR을 네모 칸 안에 비추세요'); scanning=true; primeSpeech(); voiceUnlock(); requestAnimationFrame(loop);
      }).catch(function(e){
        var nm=(e&&e.name)||'', em=(e&&e.message)||String(e), msg;
        if(nm==='NotAllowedError'||/denied|permission|not allowed/i.test(em)){
          msg='카메라 권한이 거부되었습니다. 브라우저 주소창의 자물쇠 → 카메라 "허용"으로 바꾼 뒤 다시 켜 주세요.';
        } else if(nm==='NotFoundError'||nm==='OverconstrainedError'){
          msg='후면 카메라를 찾지 못했어요. 다른 기기에서 열어 주세요.';
        } else if(nm==='NotReadableError'){
          msg='다른 앱이 카메라를 사용 중입니다. 그 앱을 닫고 다시 켜 주세요.';
        } else { msg='카메라를 열 수 없어요: '+em; }
        setMsg(msg); $('retry').className='retry show';
      });
    });
  }
  function loop(){
    if(!scanning) return;
    if(vid.readyState===vid.HAVE_ENOUGH_DATA && vid.videoWidth){
      cv.width=vid.videoWidth; cv.height=vid.videoHeight;
      ctx.drawImage(vid,0,0,cv.width,cv.height);
      try{
        var img=ctx.getImageData(0,0,cv.width,cv.height);
        var code=window.jsQR?window.jsQR(img.data,cv.width,cv.height,{inversionAttempts:'dontInvert'}):null;
        if(code && code.data){ onCode(String(code.data)); }
      }catch(e){}
    }
    requestAnimationFrame(loop);
  }
  function onCode(raw){
    var now=Date.now();
    if(raw===lastCode && (now-lastT)<2500) return;   // 같은 코드 연속 스캔 방지
    lastCode=raw; lastT=now;
    beep('scan');
    setMsg('인식됨 — 처리 중…');
    toOpener({type:'SCAN_CODE', code:raw});
  }
  function stopCam(){ scanning=false; try{ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); } }catch(e){} stream=null; }

  $('retry').addEventListener('click', startCam);
  $('close').addEventListener('click', function(){ toOpener({type:'SCAN_CLOSE'}); stopCam(); window.close(); });
  window.addEventListener('beforeunload', function(){ toOpener({type:'SCAN_CLOSE'}); stopCam(); });

  // 준비 완료를 opener에 알리고(모드 동기화 요청) 카메라 시작
  toOpener({type:'SCAN_READY'});
  startCam();
})();
</script>
