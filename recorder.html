<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOOKUS 낭독 녹음</title>
<script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
<script>
/* aka.ms 는 리디렉터라 일부 학교·학원 망에서 막히는 경우가 있다.
   기본 경로가 실패하면 npm CDN(버전 고정)에서 같은 SDK를 받는다.
   아래 진단 패널의 "Azure SDK" 항목이 둘 다 실패했는지 알려 준다. */
if (!window.SpeechSDK) {
  document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0'
    + '/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"><\/scr' + 'ipt>');
}
</script>
<style>
  :root{--ac:#2e6b4f;--acd:#1f4c38;--bd:#d8dfe6;--bg:#f4f7fa;--warn:#b23;--ok:#137a3a;--refpx:21px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
       background:var(--bg);color:#1a2230;padding:16px;-webkit-text-size-adjust:100%}
  h1{font-size:1.05rem;margin:0 0 4px;color:var(--acd)}
  .sub{font-size:.78rem;color:#7b8794;margin-bottom:12px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
  /* 본문: 크고(글자 크기 조절 가능) 줄 간격 넉넉하게 — 읽는 줄을 놓치지 않도록 */
  .ref{position:relative;font-size:var(--refpx);line-height:2.15;letter-spacing:.2px;background:#fbfaf3;border:1px solid #e6dfae;
       border-radius:8px;padding:16px 18px;max-height:52vh;overflow:auto;color:#15202e;scroll-behavior:smooth}
  .ref b{background:#fff3b0;border-radius:3px;padding:0 2px}
  /* 한 줄에 한 문장씩 */
  .ref .sent{display:block;margin:0 0 .5em}
  .ref .sent:last-child{margin-bottom:0}
  /* 따라읽기: 이미 읽은 단어는 연하게, 지금 읽을 단어는 밝게 강조 */
  .rw{border-radius:5px;padding:0 1px;transition:background .12s,color .12s}
  .rw.read{color:#9aa7b2}
  .rw.here{background:#ffe066;color:#1a2230;box-shadow:0 0 0 3px #ffe066;font-weight:800}
  /* 진단: 브라우저가 실제로 들은 말(무료 모드) */
  .heard{font-size:.74rem;color:#8a93a0;margin-top:6px;line-height:1.5;word-break:break-word}
  .heard b{color:#55606e;font-weight:700}
  /* 글자 크기 조절 바 */
  .reftool{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px}
  .reftool span{margin-right:auto;font-size:.76rem;color:#7b8794}
  .reftool button{width:auto;padding:6px 12px;font-size:.9rem;font-weight:800;border:1.5px solid var(--bd);
       background:#fff;color:#2e6b4f;border-radius:9px}
  button{width:100%;border:none;border-radius:11px;padding:14px;font-size:1rem;
         font-weight:800;cursor:pointer;font-family:inherit}
  #btnRec{background:var(--ac);color:#fff}
  #btnRec.rec{background:var(--warn)}
  #btnRec:disabled{background:#b7c3bf;cursor:not-allowed}
  .ghost{background:#fff;border:1.5px solid var(--bd);color:#55606e;margin-top:8px}
  /* 녹음 조작 카드: 본문을 아래로 스크롤해도 '다 읽었어요' 버튼이 항상 화면에 보이게 */
  .reccard{position:sticky;bottom:8px;z-index:5;box-shadow:0 -2px 10px rgba(20,40,30,.06)}
  .lv{height:8px;background:#e7ecf1;border-radius:4px;overflow:hidden;margin:10px 0 2px}
  .lv > i{display:block;height:100%;width:0;background:var(--ac);transition:width .08s}
  /* 무료 모드는 레벨미터 대신 '듣는 중' 맥박 표시(모바일 마이크 충돌 방지로 레벨미터를 안 씀) */
  .lv.listening > i{width:100%;background:linear-gradient(90deg,#bfe3cd,#2e6b4f,#bfe3cd);
       background-size:200% 100%;animation:lvpulse 1.1s linear infinite}
  @keyframes lvpulse{0%{background-position:0% 0}100%{background-position:200% 0}}
  .stat{font-size:.82rem;color:#55606e;text-align:center;margin-top:6px;min-height:1.2em}
  .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .sc{background:#f0f5fa;border:1px solid #cfdbe7;border-radius:9px;padding:9px 4px;text-align:center}
  .sc b{display:block;font-size:1.25rem;color:var(--acd)}
  .sc span{font-size:.68rem;color:#7b8794}
  .words{font-size:.9rem;line-height:2.1}
  .w-ok{color:#2b3a4a}
  .w-bad{background:#ffe0e0;color:#b23;border-radius:3px;padding:1px 4px;font-weight:700}
  .w-mid{background:#fff3cd;color:#8a6100;border-radius:3px;padding:1px 4px}
  .w-om{color:#aab3bd;text-decoration:line-through}
  details{margin-top:10px}
  summary{font-size:.8rem;color:#7b8794;cursor:pointer}
  pre{font-size:.68rem;background:#0f1720;color:#cfe3d6;padding:10px;border-radius:8px;
      overflow:auto;max-height:230px;white-space:pre-wrap;word-break:break-all}
  .diag{font-size:.74rem;line-height:1.85;color:#55606e}
  .diag i{font-style:normal;display:inline-block;min-width:118px;color:#98a3af}
  .pill{display:inline-block;font-size:.7rem;padding:2px 7px;border-radius:20px;font-weight:700}
  .p-ok{background:#e7f7ec;color:var(--ok)} .p-no{background:#ffe5e5;color:var(--warn)}
  .p-wait{background:#eef1f5;color:#7b8794}
  label{font-size:.78rem;color:#55606e;display:block;margin-bottom:4px}
  input,textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px;
                 font-size:.82rem;font-family:inherit}
</style>
</head>
<body>

<h1>🎤 BOOKUS 낭독 녹음</h1>
<div class="sub" id="subTitle">마이크 브리지 검증본 (0단계)</div>

<!-- 지문 -->
<div class="card">
  <div class="reftool">
    <span>글자 크기</span>
    <button type="button" id="fMinus" aria-label="글자 작게">가−</button>
    <button type="button" id="fPlus" aria-label="글자 크게">가＋</button>
  </div>
  <div class="ref" id="ref">지문을 기다리는 중…</div>
</div>

<!-- 녹음 -->
<div class="card reccard">
  <button id="btnRec" disabled>준비 중…</button>
  <div class="lv" id="lv"><i id="lvBar"></i></div>
  <div class="stat" id="stat">&nbsp;</div>
  <button class="ghost" id="btnMore" style="display:none;border-color:#2f7d4f;color:#1f6b3f;font-weight:700">
    ▶ 멈춘 곳부터 이어 읽기
  </button>
  <button class="ghost" id="btnSkip" style="display:none;border-color:#e6c07a;color:#8a6100">
    낭독 없이 계속하기 →
  </button>
  <button class="ghost" id="btnClose">닫기</button>
</div>

<!-- 결과 -->
<div class="card" id="cardRes" style="display:none">
  <div class="scores">
    <div class="sc"><b id="sPron">–</b><span>종합</span></div>
    <div class="sc"><b id="sAcc">–</b><span>정확도</span></div>
    <div class="sc"><b id="sFlu">–</b><span>유창성</span></div>
    <div class="sc"><b id="sCom">–</b><span>완독률</span></div>
  </div>
  <div class="words" id="words"></div>
  <!-- 🎯 발음 콕 집어 연습 (Azure 모드 · 약했던 단어 듣고 다시 읽기) -->
  <div id="praClinic" style="display:none"></div>
  <!-- iOS(아이폰·아이패드) 전체화면 모드: 제출 후 화면 전환 안내 -->
  <div id="iosNote" style="display:none;margin:10px 0;padding:11px 13px;background:#fff7ed;border:1px solid #f0d9b5;border-radius:10px;font-size:.84rem;color:#8a4b00;line-height:1.55"></div>
  <button class="ghost" id="btnSend">이 결과로 제출하기 →</button>
  <details><summary>원시 응답 보기(디버그)</summary><div class="heard" id="heard"></div><pre id="raw"></pre></details>
</div>

<!-- 진단 -->
<div class="card">
  <div class="diag" id="diag"></div>
  <details id="soloBox" style="display:none">
    <summary>단독 테스트 모드 — 토큰 직접 입력</summary>
    <div style="margin-top:8px">
      <label>Azure 지역 (예: koreacentral)</label>
      <input id="inRegion" value="koreacentral">
      <label style="margin-top:6px">인증 토큰 또는 구독키</label>
      <input id="inToken" placeholder="issueToken 결과 또는 Speech 키">
      <label style="margin-top:6px">지문</label>
      <textarea id="inRef" rows="3">A cat jumped down from a tree. He went into a big box. The cat could not get out.</textarea>
      <button class="ghost" id="btnSolo" style="margin-top:8px">이 설정으로 시작</button>
    </div>
  </details>
</div>

<script>
/* =========================================================================
   BOOKUS 낭독 녹음 페이지 (외부 출처 호스팅 전용)
   ------------------------------------------------------------------------
   왜 이 페이지가 따로 있나:
     구글 앱스스크립트 웹앱은 샌드박스 아이프레임 안에서 돌아가는데, 구글이
     그 프레임의 권한에서 마이크를 빼놨다. 그래서 학습앱 안에서 getUserMedia를
     부르면 무조건 "Permissions policy violation"으로 막힌다.
     팝업 창은 부모 프레임의 제약을 받지 않고 자기 출처의 권한을 그대로 쓰므로,
     녹음만 이 페이지에서 하고 '점수'만 학습앱으로 돌려준다.
     음성 자체는 브라우저 → Azure로 직행하며 학습앱/시트에는 닿지 않는다.

   주고받는 메시지 (postMessage):
     이 페이지 → 학습앱 : REC_READY  (준비됨, 토큰 요청)
     학습앱 → 이 페이지 : REC_INIT   {token, region, referenceText, label}
     이 페이지 → 학습앱 : REC_RESULT {payload:{scores, words, ...}}
     이 페이지 → 학습앱 : REC_CANCEL
   ========================================================================= */

/* ▼▼ 배포 전 반드시 학습앱 주소로 바꾸세요 ▼▼
   앱스스크립트 웹앱은 googleusercontent 도메인에서 렌더링되므로 둘 다 허용합니다. */
var ALLOW_ORIGINS = [
  'https://script.google.com',
  'https://n-nlhgkdzqjqjqjqjqjqj-0lu-script.googleusercontent.com'  // 예시 — 실제 값으로 교체
];
/* 검증 단계에서는 아래를 true로 두면 출처 검사를 완화합니다. 운영 전환 시 반드시 false. */
var DEV_RELAX_ORIGIN = true;

var SDK = window.SpeechSDK;
var CFG = { token:'', region:'', ref:'', label:'', engine:'azure' };   // engine: 'azure'(정밀·유료) | 'web'(무료 브라우저 인식)
function webSpeechOK(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function canStart(){
  if (!CFG.ref) return false;
  if (CFG.engine === 'web') return webSpeechOK();
  return !!(D.sdk && CFG.token);          /* azure */
}
var recognizer = null, running = false, startedAt = 0, levelTimer = null;
var segs = [];               // (Azure) 구간별 결과 누적
var webRec = null, webTokens = [], webSession = [];   // (무료 web) 인식기 · 확정(세션 간) 누적 · 현재 세션의 전체 전사
var webNoProg = 0;   // 소리/단어가 전혀 안 들어온 채로 세션이 끊긴 횟수(모바일 인앱 브라우저 감지용)
/* 카카오톡·네이버 앱 등 '인앱 브라우저(웹뷰)'에서는 브라우저 음성인식이 아예 안 되거나
   권한 창이 반복해서 뜬다. 이런 환경을 미리 감지해 '크롬/사파리로 열기'를 안내한다. */
function isInAppBrowser(){
  var ua = (navigator.userAgent || '').toLowerCase();
  return /kakaotalk|naver|whale\/|inapp|snapchat|line\/|instagram|fban|fbav|fb_iab|daumapps|everytimeapp|band\//.test(ua);
}
function isMobile(){ return /iphone|ipad|ipod|android/i.test(navigator.userAgent || ''); }
var resumeCount = 0, userStopping = false, MAX_RESUME = 40;   // 침묵으로 세션이 끊길 때 조용히 이어 듣기
var heardSpeech = false;     // 마이크로 실제 소리가 들어온 적이 있는가(무음 오판 방지)
var deafTries = 0;           // 무음 감시 재확인 횟수(소리는 들어오는데 채점이 늦을 때 더 기다린다)

/* ★ Azure 비용 안전장치 — 학생이 켜놓고 자리를 비워도 오디오가 무한정 쌓이지 않게 한다.
   Azure는 녹음된 오디오 시간만큼 과금한다. 평소엔 '방치 자동 제출'이 과금을 멈추고,
   교실 소음이 계속 인식돼 그게 안 먹는 드문 경우를 위해 '최대 녹음 시간(천장)'을 둔다.
   ★ 최대 녹음 시간은 지문 길이에 맞춰 자동 계산한다 → 짧은 지문은 짧게, 긴 챕터는 길게.
     그래서 정상 낭독은 아무리 길어도 중간에 끊기지 않는다. */
var IDLE_STOP_MS   = 8000;   // 마지막 '인식된 구간' 뒤 8초간 새 구간이 없으면(다 읽고 멈춤) 자동 제출
var RA_MS_PER_WORD = 1500;   // 아주 느린 아이 기준 한 단어 낭독 시간(약 40단어/분)
var RA_CAP_FACTOR  = 2.5;    // 예상 낭독 시간의 몇 배까지 허용할지(정상 낭독은 절대 안 끊기게 넉넉히)
var RA_CAP_MIN     = 120000; // 최대 녹음 시간 하한(2분) — 짧은 지문도 최소 이만큼은 허용
var RA_CAP_MAX     = 900000; // 최대 녹음 시간 상한(15분) — 아주 긴 챕터도 덮는 절대 천장
var capMs = RA_CAP_MIN, lastSegAt = 0, capTimer = null;   // 이번 녹음의 최대 허용 시간 · 마지막 구간 시각 · 감시 타이머
/* 무료(web) 모드 통과 기준 — 이 % 이상 '지문 순서대로' 읽어야 '낭독 완료'로 인정한다.
   (아무렇게나 몇 단어만 중얼거리면 통과 안 됨. 브라우저 받아쓰기가 완벽하진 않으니 넉넉히 잡는다.)
   학습앱 REC_INIT에서 minReadPct 로 바꿀 수 있다. */
var RA_WEB_MIN = 70;
/* 무료(web) '끝까지 읽었나' 기준 — 지문의 이 %까지 도달해야 통과(앞부분만 읽고 멈추는 것 방지). */
var RA_WEB_FINISH = 85;
/* Azure(유료) 녹음 횟수 상한 — '처음부터 다시'·'이어 읽기'로 새로 녹음을 시작하는 횟수를 제한해
   무한 재녹음으로 과금이 늘어나는 것을 막는다. (자동 이어듣기는 한 번의 녹음 안이라 세지 않는다.)
   학습앱 REC_INIT의 maxTries 로 바꿀 수 있다. 무료는 과금이 없어 적용하지 않는다. */
/* 낭독 녹음 총 상한(무료·Azure 공통). 3번까지 '끝까지' 읽으면 종합 70 미만이어도 통과시킨다
   (못 읽는 학생이 관문에 갇히지 않도록 — "3번 끝까지 읽었다"는 데 의의). 학습앱 maxTries로 조절. */
var MAX_AZ_TRIES = 3, azTries = 0;
/* 🎯 발음 콕 집어 연습(Azure) — 약했던 단어를 '그 단어만' 다시 읽어 재채점한다.
   비용: 짧은 단어 녹음이라 건당 센트 미만. 과금 폭주 방지로 '단어당'·'세션당' 상한을 둔다.
   학습앱 REC_INIT/해시 cfg의 praPerWord·praMaxRecs·praPass 로 조절 가능.          */
var PRA_PER_WORD = 3;     // 한 단어를 '소리 내어' 다시 읽을 수 있는 최대 횟수(무음은 미포함)
var PRA_MAX_RECS = 10;    // 이번 낭독 세션 발음연습 녹음 총 상한(비용 하드 천장 — 무음 포함 모든 시도)
var PRA_PASS     = 70;    // 이 점수 이상이면 '좋아졌어요 👍' + 약한 단어 선별 기준도 이 값 미만
var PRA_REC_MS   = 8000;  // 발음연습 녹음 1회 강제 종료(자리 비움·주변소음 과금 방지)
var praRecs = 0;          // 이번 세션에서 지금까지 쓴 발음연습 녹음 수(무음 포함)
var praComplete = false;  // 발음연습 의무 완료 여부(완료돼야 제출 가능)
var praTodo = 0;          // 아직 연습이 안 끝난 약한 단어 수
var praLog = [];          // 연습 기록(선생님 보고용): [{word, base, best, tries, passed}]
var parentOrigin = null;

var $ = function(id){ return document.getElementById(id); };

/* ---------- 진단 패널 ---------- */
function pill(ok, txt){ return '<span class="pill '+(ok===null?'p-wait':(ok?'p-ok':'p-no'))+'">'+txt+'</span>'; }
var D = { sdk:null, mic:null, token:null, secure:null, opener:null };
function drawDiag(){
  var ua = navigator.userAgent;
  var os = /iPhone|iPad|iPod/.test(ua)?'iOS':/Android/.test(ua)?'Android':
           /Mac/.test(ua)?'macOS':/Windows/.test(ua)?'Windows':'기타';
  var br = /CriOS|Chrome/.test(ua)?'Chrome':/FxiOS|Firefox/.test(ua)?'Firefox':
           /EdgiOS|Edg/.test(ua)?'Edge':/Safari/.test(ua)?'Safari':'기타';
  $('diag').innerHTML =
     '<i>기기 / 브라우저</i> '+os+' · '+br+'<br>'
   + '<i>HTTPS(보안)</i> '+pill(D.secure, D.secure?'정상':'아님')+'<br>'
   + '<i>Azure SDK</i> '+pill(D.sdk, D.sdk===null?'확인 중':(D.sdk?'로드됨':'실패'))+'<br>'
   + '<i>학습앱 연결</i> '+pill(D.opener, D.opener===null?'대기':(D.opener?'연결됨':'단독 실행'))+'<br>'
   + '<i>토큰</i> '+pill(D.token, D.token===null?'대기':(D.token?'수신':'없음'))+'<br>'
   + '<i>마이크 권한</i> '+pill(D.mic, D.mic===null?'미요청':(D.mic?'허용됨':'거부/실패'));
}

/* ---------- 초기화 ---------- */
D.secure = (location.protocol === 'https:' || location.hostname === 'localhost');
D.sdk = !!(SDK && SDK.SpeechConfig);
D.opener = !!(window.opener && window.opener !== window);
drawDiag();

if (!D.opener) { $('soloBox').style.display = 'block'; $('stat').textContent = '단독 실행 — 아래에서 토큰을 넣어 테스트하세요.'; }
if (!D.sdk) { $('stat').innerHTML = '<span style="color:#b23">Azure 음성 SDK를 불러오지 못했습니다. 네트워크/차단 확인.</span>'; }

/* 학습앱에 "준비됐다"고 알리고 토큰을 요청 */

/* REC_INIT(팝업) · 해시(iOS 전체화면) 공용 — 지문/엔진/토큰/기준을 받아 화면을 준비한다. */
function applyInit(d){
    CFG.token = d.token || ''; CFG.region = d.region || 'koreacentral';
    CFG.ref = String(d.referenceText || '').trim(); CFG.label = d.label || '';
    CFG.engine = (d.engine === 'web') ? 'web' : (d.engine === 'azure' ? 'azure' : (CFG.token ? 'azure' : 'web'));
    if (typeof d.minReadPct === 'number' && d.minReadPct >= 0 && d.minReadPct <= 100) RA_WEB_MIN = d.minReadPct;
    if (typeof d.finishPct === 'number' && d.finishPct >= 0 && d.finishPct <= 100) RA_WEB_FINISH = d.finishPct;   // (무료) '끝까지' 기준
    if (typeof d.idleStopSec === 'number' && d.idleStopSec >= 3 && d.idleStopSec <= 120) IDLE_STOP_MS = d.idleStopSec * 1000;   // (Azure) 방치 자동제출까지 대기 시간
    if (typeof d.maxTries === 'number' && d.maxTries >= 1 && d.maxTries <= 20) MAX_AZ_TRIES = d.maxTries;   // (Azure) 녹음 횟수 상한
    if (d.follow === false) FOLLOW_ON = false;   // 따라읽기(현재 단어 강조·자동 스크롤) 끄기 옵션(기본 켜짐)
    if (typeof d.praPerWord === 'number' && d.praPerWord >= 1 && d.praPerWord <= 10) PRA_PER_WORD = d.praPerWord;   // 🎯 발음연습 단어당 횟수
    if (typeof d.praMaxRecs === 'number' && d.praMaxRecs >= 0 && d.praMaxRecs <= 60) PRA_MAX_RECS = d.praMaxRecs;   // 🎯 세션 발음연습 총 상한(0=끔)
    if (typeof d.praPass === 'number' && d.praPass >= 0 && d.praPass <= 100) PRA_PASS = d.praPass;                  // 🎯 '좋아요' 기준점
    D.token = !!CFG.token; drawDiag();
    if (CFG.label) $('subTitle').textContent = CFG.label;
    showRef(CFG.ref);
    $('btnRec').disabled = !canStart();
    $('btnRec').textContent = '🎤 녹음 시작';
    if (CFG.engine === 'web' && !webSpeechOK()) {
      $('stat').innerHTML = '<span style="color:#b23">이 브라우저는 무료 음성인식을 지원하지 않습니다(크롬·사파리 권장). '
        + '아래 버튼으로 계속 진행하세요.</span>';
      $('btnSkip').style.display = '';
    } else if (CFG.engine === 'web' && isInAppBrowser()) {
      /* 카카오톡·네이버 앱 안(웹뷰)에서는 음성인식이 거의 안 된다 → 미리 안내 + 빠져나갈 길 제공 */
      $('stat').innerHTML = '<span style="color:#b23">카카오톡·네이버 앱 안에서는 음성 낭독이 잘 안 돼요. '
        + '오른쪽 위 메뉴(⋮/공유)에서 <b>Chrome</b>·<b>Safari로 열기</b>를 눌러 주세요. (그냥 진행하려면 아래 버튼)</span>';
      $('btnSkip').style.display = '';
    } else {
      $('stat').textContent = '버튼을 누르고 지문을 소리 내어 읽어 주세요.'
        + (CFG.engine === 'web' ? ' (무료 모드: 읽기 일치율로 채점)' : '');
    }
}
window.addEventListener('message', function(e){
  if (!DEV_RELAX_ORIGIN && ALLOW_ORIGINS.indexOf(e.origin) === -1) return;
  var d = e.data || {};
  if (d.type === 'REC_INIT') { parentOrigin = e.origin; applyInit(d); }
  else if (d.type === 'REC_ERROR') {
    $('stat').innerHTML = '<span style="color:#b23">'+ (d.message||'오류') +'</span>';
  }
});

/* ───── iOS 전체화면(리다이렉트) 모드 ─────────────────────────────────────────
   학습앱(GAS)이 팝업 대신 이 페이지로 '탭 전체'를 이동시켜 올 때, 필요한 정보를
   주소(해시)로 받는다. 끝나면 돌아갈 주소(ret)와 재접속 토큰(rt)도 함께 온다.
   해시는 클라이언트에만 남고 서버로 전송되지 않는다(토큰 노출 없음).            */
var REDIRECT = false, RETURN_URL = '', RT = '';
function b64urlDec(s){
  try { s = String(s).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
        return decodeURIComponent(escape(atob(s))); } catch(e){ return ''; }
}
function b64urlEnc(s){
  try { return btoa(unescape(encodeURIComponent(String(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  catch(e){ return ''; }
}
function detectRedirect(){
  var h = location.hash || '';
  var m = h.match(/[#&]rec=([^&]+)/);
  if (!m) return;
  var cfg; try { cfg = JSON.parse(b64urlDec(decodeURIComponent(m[1]))); } catch(e){ return; }
  if (!cfg || !cfg.ret) return;
  REDIRECT = true; RETURN_URL = String(cfg.ret || ''); RT = String(cfg.rt || '');
  /* 해시는 즉시 지워 둔다(새로고침·뒤로가기 꼬임 방지). 설정은 아래에서 바로 적용. */
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  /* 전체화면 모드는 opener가 없어도 '단독 실행'이 아니다 — 단독 안내/토큰입력칸을 숨긴다. */
  try { $('soloBox').style.display = 'none'; } catch(e){}
  /* iOS 전체화면 모드: 제출하면 로그인 화면을 잠깐 거쳐 원래 자리로 돌아간다는 것을 미리 안내. */
  try { var _n=$('iosNote'); if(_n){ _n.innerHTML='📌 <b>제출한 뒤 안내</b> — 잠깐 로그인 화면이 스쳤다가 <b>원래 학습하던 자리로 자동으로</b> 돌아가요. 오류가 아니니, 화면을 닫거나 여러 번 누르지 말고 <b>몇 초만</b> 기다려 주세요. 🙂'; _n.style.display='block'; } } catch(e){}
  applyInit({
    token: cfg.token || '', region: cfg.region || 'koreacentral',
    referenceText: cfg.ref || '', label: cfg.label || '', engine: cfg.engine || 'web',
    minReadPct: cfg.minReadPct, finishPct: cfg.finishPct,
    idleStopSec: cfg.idleStopSec, maxTries: cfg.maxTries, follow: cfg.follow
  });
}

/* 결과·취소·실패를 학습앱으로 되돌린다(전체화면 모드: 팝업이 아니라 탭 이동이므로 postMessage 대신 복귀). */
function returnToApp(result){
  var url = RETURN_URL;
  if (!url) return;
  var sep = (url.indexOf('?') === -1) ? '?' : '&';
  url += sep + 'rt=' + encodeURIComponent(RT) + '&rar=' + encodeURIComponent(b64urlEnc(JSON.stringify(result || {})));
  try { location.replace(url); } catch(e){ location.href = url; }
}

/* 지문을 '한 줄에 한 문장씩' + 단어 조각으로 렌더 → 읽는 위치를 따라가며 강조. */
var REF_WORDS = [];   // [{norm}] 지문 단어의 정규화형(정렬용)
function showRef(t){
  var box = $('ref');
  var raw = String(t || '').replace(/\s+/g, ' ').trim();
  if (!raw) { box.textContent = '(지문 없음)'; REF_WORDS = []; return; }
  /* 문장 단위로 끊는다(. ! ? 뒤에서). 각 문장은 한 줄(block)로 배치 → 읽는 줄을 놓치지 않게. */
  var sentences = raw.match(/[^.!?]+[.!?]*\s*/g) || [raw];
  REF_WORDS = [];
  var html = '';
  for (var s = 0; s < sentences.length; s++){
    var words = sentences[s].trim().split(/\s+/).filter(Boolean);
    if (!words.length) continue;
    html += '<span class="sent">';
    for (var w = 0; w < words.length; w++){
      var n = normWord(words[w]);
      if (n){ html += '<span class="rw" data-i="' + REF_WORDS.length + '">' + escapeHtml(words[w]) + '</span> '; REF_WORDS.push({ norm:n }); }
      else  { html += escapeHtml(words[w]) + ' '; }
    }
    html += '</span>';
  }
  box.innerHTML = html;
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 두 단어가 '사실상 같은가' — 무료 인식은 외국어 아동 발음을 조금씩 틀리게 받아쓰므로
   완전히 똑같지 않아도(철자 1자 차이·앞부분 일치) 맞은 것으로 본다(관대 매칭). */
function lev1(a, b){            // 편집거리 ≤ 1 인가(빠른 판정)
  var la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  var i = 0, j = 0, diff = 0;
  while (i < la && j < lb){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++diff > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  if (i < la || j < lb) diff++;
  return diff <= 1;
}
function wordMatch(a, b){
  if (a === b) return true;
  var la = a.length, lb = b.length;
  if (la >= 4 && lb >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;   // 앞부분 일치(store/stor)
  if (Math.max(la, lb) >= 4 && lev1(a, b)) return true;                                  // 철자 1자 차이(puppy/puppi)
  return false;
}
/* 말한 토큰을 지문 단어에 '순서대로' 최대한 맞춘다(LCS·최장 공통 부분수열).
   그리디(앞으로만 훑기)는 'the·their·to·seeds'처럼 반복되는 단어에서 멀리 있는
   같은 단어로 건너뛰어(overshoot) 그 뒤를 전부 놓치는 치명적 문제가 있다 →
   순서를 지키면서 '가장 많이' 맞는 조합을 찾는 LCS로 그 문제를 없앤다. 관대 매칭 사용. */
function alignWeb(sp){
  var R = REF_WORDS.length, S = sp.length;
  if (!R) return { matched:0, lastRefHit:-1, ok:[] };
  /* LCS 길이표 L[i][j] + 매칭표 match[i][j] 를 한 번에 만든다. */
  var L = [ new Int32Array(S + 1) ], match = [];
  for (var i = 1; i <= R; i++){
    var rn = REF_WORDS[i - 1].norm, pr = L[i - 1], crow = new Int32Array(S + 1), mr = new Uint8Array(S + 1);
    for (var j = 1; j <= S; j++){
      if (wordMatch(sp[j - 1], rn)){ mr[j] = 1; crow[j] = pr[j - 1] + 1; }
      else crow[j] = pr[j] >= crow[j - 1] ? pr[j] : crow[j - 1];
    }
    L.push(crow); match.push(mr);
  }
  /* 역추적: 어느 ref 단어가 매칭에 쓰였는지 표시, 가장 뒤 매칭 index(last) 기록. */
  var ok = new Array(R); for (var z = 0; z < R; z++) ok[z] = false;
  var ri = R, sj = S, last = -1;
  while (ri > 0 && sj > 0){
    if (match[ri - 1][sj] && L[ri][sj] === L[ri - 1][sj - 1] + 1){ ok[ri - 1] = true; if (last < 0) last = ri - 1; ri--; sj--; }
    else if (L[ri - 1][sj] >= L[ri][sj - 1]) ri--; else sj--;
  }
  return { matched:L[R][S], lastRefHit:last, ok:ok };
}

/* ✨ 따라읽기 — '앞으로만·조금씩' 이동(지역 창 매칭).
   채점용 전역 정렬(LCS)을 하이라이트에 쓰면, the·to·a·Max 처럼 지문에 여러 번 나오는 단어 때문에
   매칭이 글 '후반부'로 튀어 하이라이트가 멀리 날아간다(사용자 보고 현상). 그래서 하이라이트는
   '현재 위치 바로 다음 몇 단어' 안에서만 전진시킨다 → 읽는 사람을 지역적으로 따라감(멀리 안 튐). */
var FOLLOW_ON = true, followPos = -1, followSp = 0, FOLLOW_WIN = 12;
function updateFollow(){
  if (!FOLLOW_ON || !REF_WORDS.length) return;
  var spans = $('ref').getElementsByClassName('rw');
  if (!spans.length) return;
  var sp = allSpoken();
  if (sp.length < followSp) followSp = 0;        // 다시 시작 등으로 줄면 초기화(방어)
  if (sp.length <= followSp) return;             // 새 단어 없으면 그대로
  var moved = false;
  for (var i = followSp; i < sp.length; i++){
    var tok = sp[i];
    var hi = Math.min(REF_WORDS.length - 1, followPos + FOLLOW_WIN);   // 현재 위치 다음 ~12단어까지만 본다
    for (var r = followPos + 1; r <= hi; r++){
      if (wordMatch(tok, REF_WORDS[r].norm)){ followPos = r; moved = true; break; }
    }
  }
  followSp = sp.length;
  if (!moved) return;
  for (var m = 0; m < spans.length; m++){
    spans[m].classList.toggle('read', m <= followPos);
    spans[m].classList.toggle('here', m === followPos + 1);
  }
  var here = spans[followPos + 1];
  if (here){
    var box = $('ref');
    var target = here.offsetTop - box.clientHeight / 2 + here.offsetHeight / 2;
    box.scrollTop = Math.max(0, target);
  }
}
function clearFollow(){
  followPos = -1; followSp = 0;
  var spans = $('ref').getElementsByClassName('rw');
  for (var m = 0; m < spans.length; m++){ spans[m].classList.remove('read','here'); }
  try { $('ref').scrollTop = 0; } catch(e){}
  if ($('heard')) $('heard').innerHTML = '';
}
/* 진단: 브라우저가 실제로 '들은 말'을 화면에 보여 준다(무료 모드). 점수가 낮을 때 원인 파악용. */
function showHeard(){
  if (CFG.engine !== 'web' || !$('heard')) return;
  var t = allSpoken().join(' ');
  $('heard').innerHTML = t ? ('<b>들린 말:</b> ' + escapeHtml(t)) : '';
}

/* ---------- 본문 글자 크기 조절(+/−) · 브라우저에 기억 ---------- */
var REF_MIN = 16, REF_MAX = 40, REF_DEF = 21;
function setRefPx(px){
  px = Math.max(REF_MIN, Math.min(REF_MAX, px|0));
  document.documentElement.style.setProperty('--refpx', px + 'px');
  try { localStorage.setItem('bookusRefPx', String(px)); } catch(e){}
  return px;
}
function curRefPx(){
  var v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--refpx'), 10);
  return isNaN(v) ? REF_DEF : v;
}
(function initRefFont(){
  var saved = REF_DEF;
  try { var s = parseInt(localStorage.getItem('bookusRefPx'), 10); if (!isNaN(s)) saved = s; } catch(e){}
  setRefPx(saved);
  $('fPlus').addEventListener('click',  function(){ setRefPx(curRefPx() + 2); });
  $('fMinus').addEventListener('click', function(){ setRefPx(curRefPx() - 2); });
})();

/* ---------- 실패를 학습앱에 알린다 (학생이 관문에 갇히지 않게) ----------
   이게 없으면 학습앱은 "학생이 그냥 창을 닫았다"로만 알게 되어
   낭독 요건이 풀리지 않고 관문이 잠긴 채로 남는다. */
var FAILED = false;
function failParent(reason, detail){
  if (FAILED) return; FAILED = true;
  if (REDIRECT) { returnToApp({ ok:false, reason:reason, message:String(detail||'') }); return; }   // 전체화면 모드: 앱으로 복귀(관문 해제)
  if (D.opener) {
    try { window.opener.postMessage({ type:'REC_FAIL', reason:reason,
            message:String(detail||'') }, parentOrigin||'*'); } catch(e){}
  }
  /* 화면도 확실히 되돌린다. SDK가 실패를 알린 뒤에도 start 성공 콜백이 늦게 들어와
     "듣고 있어요…"로 덮어쓰는 경우가 있어서, 여기서 상태를 확정한다. */
  running = false;
  clearTimeout(window.__deaf__);
  clearInterval(capTimer);
  stopLevelMeter(); $('lv').classList.remove('listening');
  var b = $('btnRec');
  b.classList.remove('rec'); b.disabled = false; b.textContent = '🎤 다시 시도';
  $('btnSkip').style.display = '';          // 학생이 빠져나갈 길을 항상 열어 둔다
}
$('btnSkip').addEventListener('click', function(){
  if (REDIRECT) { returnToApp({ ok:false, reason:'skipped_by_student' }); return; }
  failParent('skipped_by_student', '');
  window.close();
});
$('btnMore').addEventListener('click', resumeMore);   /* ▶ 멈춘 곳부터 이어 읽기 */

/* 단독 테스트 모드 */
$('btnSolo').addEventListener('click', function(){
  CFG.region = $('inRegion').value.trim() || 'koreacentral';
  CFG.token  = $('inToken').value.trim();
  CFG.ref    = $('inRef').value.trim();
  D.token = !!CFG.token; drawDiag(); showRef(CFG.ref);
  $('btnRec').disabled = !(D.sdk && CFG.token && CFG.ref);

  $('stat').textContent = '단독 모드 준비 완료.';

/* ---------- 녹음 + 발음평가 ---------- */
$('btnRec').addEventListener('click', function(){ running ? stopRec() : startRec(); });
$('btnClose').addEventListener('click', function(){
  if (REDIRECT) { returnToApp({ ok:false, reason:'cancelled' }); return; }
  if (D.opener) { try { window.opener.postMessage({type:'REC_CANCEL'}, parentOrigin||'*'); } catch(e){} }
  window.close();

function makeSpeechConfig(){
  /* 토큰(권장) 또는 구독키 둘 다 받아준다 — 토큰은 보통 길고 점(.)이 들어간다 */
  var sc;
  if (CFG.token.length > 120 || CFG.token.indexOf('.') !== -1) {
    sc = SDK.SpeechConfig.fromAuthorizationToken(CFG.token, CFG.region);
  } else {
    sc = SDK.SpeechConfig.fromSubscription(CFG.token, CFG.region);
  }
  sc.speechRecognitionLanguage = 'en-US';
  /* 문장 중간의 짧은 숨·머뭇거림에서 구간이 끊기지 않도록 침묵 허용치를 늘린다(천천히 읽는 아이 배려) */
  try { sc.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs, '1500'); } catch(e){}
  /* 시작 직후 잠깐 머뭇거려도 끊기지 않도록 초기 침묵 허용치도 넉넉히 */
  try { sc.setProperty(SDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs, '15000'); } catch(e){}
  return sc;
}

/* 낭독 녹음 횟수 관문(무료·Azure 공통) — '처음부터 다시'·'이어 읽기'로 새 녹음을 시작할 때마다 센다.
   상한(3회)을 넘으면 새 녹음을 막고, 지금까지 읽은 것으로 '통과'시켜 제출하게 한다
   (Azure는 무한 재녹음 과금도 막아 준다). */
function azTryGate(){
  if (azTries >= MAX_AZ_TRIES) {
    $('stat').innerHTML = '<span style="color:#1f6b3f">낭독을 ' + MAX_AZ_TRIES + '번 했어요 — 충분히 잘했어요! 👍 '
      + '아래 「이 결과로 제출하기」를 눌러 다음으로 넘어가세요.</span>';
    $('btnMore').style.display = 'none';
    $('btnSkip').style.display = '';
    $('btnRec').disabled = true;                 /* 더는 새 녹음 불가 */
    if ($('btnSend')) $('btnSend').style.display = '';   /* 3회 소진 → 통과 처리(제출 허용) */
    return false;
  }
  azTries++;
  return true;
}
function azLeftNote(){
  return ' · 낭독 ' + Math.max(0, MAX_AZ_TRIES - azTries) + '회 남음';
}

function startRec(){
  if (!canStart()) return;
  if (!azTryGate()) return;             /* (Azure) 녹음 횟수 상한 확인 */
  segs = []; webTokens = []; webSession = []; $('cardRes').style.display='none';
  praRecs = 0; praComplete = false; praTodo = 0; praLog = [];   /* 새 낭독 → 발음연습 초기화 */
  var _pc=$('praClinic'); if(_pc){ _pc.style.display='none'; _pc.innerHTML=''; }
  clearFollow();                        /* 처음부터 다시 → 따라읽기 강조 초기화 */
  $('btnMore').style.display = 'none';   /* 처음부터 다시 → 이어읽기 버튼 숨김 */
  FAILED = false;                       /* 다시 시도하면 판정을 초기화한다 */
  resumeCount = 0; userStopping = false; heardSpeech = false; deafTries = 0; webNoProg = 0;

  if (CFG.engine === 'web') {
    /* ★ 무료 모드: 레벨미터(getUserMedia)로 마이크를 먼저 붙잡으면, 모바일에서 브라우저
       음성인식이 소리를 못 받는다(= 초록막대만 움직이고 '인식된 말 없음'). 또 iOS는
       반드시 '탭 제스처 안에서' 인식을 시작해야 한다. 그래서 getUserMedia 없이,
       인식기(webRec.start)가 직접 권한 요청·마이크 점유를 하도록 바로 시작한다. */
    $('stat').textContent = '마이크 권한을 허용해 주세요…';
    $('lv').classList.add('listening');          // 레벨미터 대신 '듣는 중' 표시
    beginWebRecognition();
    return;
  }

  /* 정밀(Azure): SDK가 마이크를 쓰므로 레벨미터와 함께 권한을 먼저 받는다. */
  $('stat').textContent = '마이크 권한을 확인하는 중…';
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    D.mic = true; drawDiag();
    startLevelMeter(stream);
    beginRecognition();
  }).catch(function(err){
    D.mic = false; drawDiag();
    $('stat').innerHTML = '<span style="color:#b23">마이크를 열 수 없습니다: '
      + (err && err.name ? err.name : '오류')
      + '<br>브라우저 주소창의 마이크 권한을 허용해 주세요.</span>';
    failParent('mic_denied', err && err.name);   /* 학습앱이 낭독 요건을 풀도록 */
  });
}

/* 인식기 하나를 만들어 핸들러까지 붙여 돌려준다(첫 시작·자동 이어듣기 공용) */
function buildRecognizer(){
  var sc = makeSpeechConfig();
  var ac = SDK.AudioConfig.fromDefaultMicrophoneInput();
  var rec = new SDK.SpeechRecognizer(sc, ac);

  var pa = new SDK.PronunciationAssessmentConfig(
    CFG.ref,
    SDK.PronunciationAssessmentGradingSystem.HundredMark,
    SDK.PronunciationAssessmentGranularity.Phoneme,
    true                      /* enableMiscue: 누락·삽입 단어를 잡아준다 */
  );
  pa.applyTo(rec);

  /* 중간 인식(말하는 도중 실시간으로 계속 들어온다) — 마이크가 살아있다는 확실한 증거.
     소리가 들어오는 한 "소리 없음" 안전장치가 발동하지 않도록 타이머를 꺼 둔다. */
  rec.recognizing = function(s, e){
    if (FAILED) return;
    heardSpeech = true;
    clearTimeout(window.__deaf__);
    if (running && !segs.length) $('stat').textContent = '듣고 있어요… 계속 읽어 주세요.';
  };
  rec.recognized = function(s, e){
    if (FAILED) return;
    if (e.result.reason !== SDK.ResultReason.RecognizedSpeech) return;
    try {
      var js = e.result.properties.getProperty(SDK.PropertyId.SpeechServiceResponse_JsonResult);
      var nb = JSON.parse(js).NBest[0];
      segs.push(nb);
      heardSpeech = true;
      lastSegAt = Date.now();          /* 마지막 채점 구간 시각 갱신(방치 자동제출 판단용) */
      clearTimeout(window.__deaf__);
      updateFollow();                  /* ✨ 읽은 위치까지 따라가며 강조 + 자동 스크롤 */
      $('stat').textContent = '읽는 중… ' + segs.length + '구간 (' + elapsed() + '초) — 다 읽으면 ■ 버튼을 눌러요';
    } catch(err){}
  };
  rec.canceled = function(s, e){
    var det = String((e && e.errorDetails) || '');
    var isError = e && SDK.CancellationReason && (e.reason === SDK.CancellationReason.Error);
    /* 키·권한·연결이 아예 막힌 치명적 오류는 이어 듣지 않고 곧바로 마무리한다 */
    var isFatal = isError && /401|403|forbidden|authentic|unauthoriz|upgrade failed|invalid|quota|throttl/i.test(det);
    /* 학생이 아직 "다 읽었어요"를 안 눌렀는데 침묵 등으로 세션이 끝난 것뿐이면
       → 조용히 인식을 다시 시작해 끊김 없이 계속 읽게 한다(구간은 그대로 누적). */
    if (running && !userStopping && !isFatal && resumeCount < MAX_RESUME) {
      resumeCount++;
      try { rec.close(); } catch(x){}
      if (recognizer === rec) recognizer = null;
      resumeRecognition();
      return;
    }
    /* 오류라도 이미 채점 구간이 있으면 그걸로 마무리(부분 점수라도 살린다) */
    if (segs.length) { stopRec(true); render(); return; }
    var msg = det || (e && e.reason) || '알 수 없는 오류';
    $('stat').innerHTML = '<span style="color:#b23">채점 서버에 연결하지 못했습니다.<br>'
      + '<span style="font-size:.9em;color:#7b8794">' + String(msg).slice(0,120) + '</span></span>';
    stopRec(true);
    failParent('azure_failed', msg);
  };
  return rec;
}

/* 무음 감시: 소리(마이크 레벨)가 들어오는 한 절대 학생을 끊지 않는다.
   · 채점 구간이 하나라도 오면 → 문제 없음(타이머는 recognized에서 이미 꺼짐)
   · 소리는 들어오는데(heardSpeech) 아직 채점이 안 왔으면 → 끊지 말고 더 기다린다
   · 소리도 전혀 없으면(heardSpeech=false) → 진짜 마이크 문제이므로 그때만 알린다 */
function armDeafWatch(){
  clearTimeout(window.__deaf__);
  window.__deaf__ = setTimeout(function(){
    if (!running || segs.length) return;
    if (heardSpeech && deafTries < 6) {     // 소리는 들어오는 중 → 최대 ~2분까지 더 기다림
      deafTries++;
      $('stat').textContent = '듣고 있어요… 편하게 계속 읽어 주세요. (다 읽으면 ■ 버튼)';
      armDeafWatch();
      return;
    }
    if (heardSpeech) return;                // 소리는 났었는데 채점만 늦는 경우 — 끊지 않는다
    $('stat').innerHTML = '<span style="color:#b23">소리가 들어오지 않고 있어요. '
      + '마이크를 확인하거나 아래 버튼으로 계속 진행하세요.</span>';
    failParent('no_speech', 'no audio 20s');
  }, 20000);
}

/* ★ 비용 상한 감시(1초마다) — 최대 녹음 시간 초과 또는 방치(오래 무음) 시 자동 제출한다.
   자동 이어듣기와 무관하게 '녹음 시작 시각'부터의 실제 경과로 판단하므로 상한이 확실히 걸린다. */
function startCapWatch(){
  clearInterval(capTimer);
  capTimer = setInterval(function(){
    if (!running) { clearInterval(capTimer); return; }
    var now = Date.now();
    if (now - startedAt > capMs) { autoFinish('max'); return; }                   /* 최대 시간(지문 길이 기준) 초과 → 강제 제출 */
    /* 방치 자동 제출은 'Azure 과금 중단'용이다. 무료(web)는 과금이 없고, 브라우저 인식이
       잠깐 멈추는 사이 '소리 없음'으로 오판해 읽는 학생을 끊어버리므로 적용하지 않는다.
       → 무료 모드에서는 학생이 다 읽고 '■ 다 읽었어요'를 누를 때까지 기다린다. */
    if (CFG.engine !== 'web' && (segs.length) && (now - lastSegAt > IDLE_STOP_MS)) { autoFinish('idle'); }  /* (Azure만) 읽다가 오래 방치 → 자동 제출 */
  }, 1000);
}
/* 상한에 걸려 자동으로 끝낼 때: 지금까지 읽은 것으로 채점하고 녹음을 확실히 멈춘다(오디오 과금 중단). */
function autoFinish(why){
  if (!running || userStopping) return;
  clearInterval(capTimer);
  window.__autoNote__ = (why === 'max')
    ? '⏱️ 최대 녹음 시간에 도달해 자동 제출했어요.'
    : '⏱️ 한동안 소리가 없어 자동 제출했어요.';
  stopRec(false);                    /* 지금까지 구간으로 채점(render) — 없으면 no_speech 로 안전 종료 */
}

function beginRecognition(){
  resumeCount = 0; userStopping = false; heardSpeech = false; deafTries = 0;
  recognizer = buildRecognizer();
  recognizer.startContinuousRecognitionAsync(function(){
    if (FAILED) return;              /* 이미 실패로 판정된 뒤 늦게 도착한 콜백은 무시 */
    running = true; startedAt = Date.now(); lastSegAt = Date.now();
    /* 이번 지문 길이에 맞춰 최대 녹음 시간을 정한다(긴 챕터는 길게 → 정상 낭독은 안 끊김) */
    var words = String(CFG.ref || '').split(/\s+/).filter(Boolean).length;
    capMs = Math.min(RA_CAP_MAX, Math.max(RA_CAP_MIN, words * RA_MS_PER_WORD * RA_CAP_FACTOR + 30000));
    $('btnRec').textContent = '■ 다 읽었어요'; $('btnRec').classList.add('rec');
    $('stat').textContent = '듣고 있어요… 지문을 소리 내어 읽어 주세요.';
    armDeafWatch();                  /* 마이크로 소리가 전혀 안 들어올 때만 알리는 감시 */
    startCapWatch();                 /* 비용 안전장치: 최대 시간·방치 자동 제출 */
  }, function(err){
    $('stat').innerHTML = '<span style="color:#b23">시작 실패: '+err+'</span>';
    failParent('start_failed', err);
  });
}

/* 침묵 등으로 세션이 끝났을 때, 학생 몰래 인식을 다시 시작해 끊김을 없앤다.
   버튼·타이머·누적 구간(segs)은 그대로 두고 소리만 다시 듣기 시작한다. */
function resumeRecognition(){
  if (!running || userStopping || FAILED) return;
  recognizer = buildRecognizer();
  recognizer.startContinuousRecognitionAsync(function(){
    /* 재개 성공 — 화면은 그대로(학생은 계속 읽던 중) */
  }, function(err){
    /* 재개조차 실패하면: 읽은 구간이 있으면 그걸로 마무리, 없으면 실패 처리 */
    if (segs.length) { stopRec(true); render(); }
    else failParent('azure_failed', '재개 실패: ' + err);
  });
}

/* ═══════════════ 무료 엔진: 브라우저 Web Speech(과금 없음) ═══════════════
   브라우저 내장 음성인식으로 전사만 받아, 지문과 대조해 '읽기 일치율'로 채점한다.
   발음의 질(정확도·유창성)은 측정하지 못하지만, 낭독 게이트용으로는 충분하고 무료다. */
function normWord(w){ return String(w||'').toLowerCase().replace(/[^a-z0-9']/g,''); }
function tokenizeWords(text){
  var ws = String(text||'').split(/\s+/), out = [];
  for (var i=0;i<ws.length;i++){ var n = normWord(ws[i]); if (n) out.push(n); }
  return out;
}
/* a 의 '끝부분'과 b 의 '앞부분'이 겹치면 그만큼 빼고 이어 붙인다(중복 제거).
   모바일 크롬은 자라나는 전사를 반복해 보내므로(monica→monica was→…) 이 겹침 제거가 핵심. */
function mergeOverlap(a, b){
  if (!a.length) return b.slice();
  if (!b.length) return a.slice();
  var max = Math.min(a.length, b.length), k = 0;
  for (var n = max; n >= 1; n--){
    var ok = true;
    for (var i = 0; i < n; i++){ if (a[a.length - n + i] !== b[i]) { ok = false; break; } }
    if (ok){ k = n; break; }
  }
  return a.concat(b.slice(k));
}
/* 지금까지 '말한 단어' = (무료) 확정 누적 + 현재 세션 전사(겹침 제거) / (Azure) 구간별 단어. 공용. */
function allSpoken(){
  if (CFG.engine !== 'web'){
    var out = [];
    segs.forEach(function(nb){ (nb.Words || []).forEach(function(w){ var n = normWord(w.Word); if (n) out.push(n); }); });
    return out;
  }
  return mergeOverlap(webTokens, webSession);
}
/* 현재 세션 전사를 확정 누적으로 '동결'(겹침 제거). 세션이 바뀌거나 멈출 때 호출. */
function freezeSession(){ if (webSession.length){ webTokens = mergeOverlap(webTokens, webSession); webSession = []; } }
function beginWebRecognition(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { failParent('web_unsupported', '브라우저 음성인식 미지원'); return; }
  resumeCount = 0; userStopping = false; heardSpeech = false; deafTries = 0;
  try { webRec = new SR(); } catch(e){ failParent('start_failed', String(e)); return; }
  webRec.lang = 'en-US'; webRec.continuous = true; webRec.interimResults = true; webRec.maxAlternatives = 1;

  webRec.onresult = function(ev){
    if (!running || userStopping) return;     /* 멈춘 뒤 늦게 도착한 결과는 무시(상태표시 덮어쓰기·멈춤 방지) */
    D.mic = true; webNoProg = 0;              /* 결과가 오면 마이크·인식 정상(진행 중) */
    heardSpeech = true; clearTimeout(window.__deaf__);
    /* 이 세션의 '전체 전사'를 다시 구성한다. 안드로이드 크롬은 한 세션 안에서 결과를 '누적형'으로
       보내는 경우가 많다(각 결과가 앞 내용을 통째로 다시 포함) → 단순히 이어 붙이면 중복 폭증.
       그래서 결과들을 '겹침 제거(mergeOverlap)'로 합쳐, 누적형이든 조각형이든 중복 없이 한 벌로 만든다. */
    var toks = [];
    for (var i = 0; i < ev.results.length; i++){
      toks = mergeOverlap(toks, tokenizeWords((ev.results[i][0] && ev.results[i][0].transcript) || ''));
    }
    webSession = toks;
    lastSegAt = Date.now();
    updateFollow();               /* ✨ '앞으로만' 따라가며 강조·자동 스크롤(떨림 없음) */
    showHeard();
    var n = allSpoken().length;
    if (n) $('stat').textContent = '읽는 중… ' + n + '단어 (' + elapsed() + '초) — 다 읽으면 ■ 버튼을 눌러요';
    else if (running) $('stat').textContent = '듣고 있어요… 계속 읽어 주세요.';
  };
  webRec.onerror = function(ev){
    var err = (ev && ev.error) || '';
    if (err === 'not-allowed' || err === 'service-not-allowed') { failParent('mic_denied', err); return; }
    if (err === 'language-not-supported' || err === 'bad-grammar') { failParent('web_unsupported', err); return; }
    /* no-speech / aborted / network 등은 onend에서 자동 재시작으로 처리 */
  };
  webRec.onend = function(){
    /* Web Speech는 침묵이 조금만 길어도 스스로 멈춘다. 학생이 아직 "다 읽었어요"를
       안 눌렀으면 조용히 다시 시작해 끊김 없이 이어 읽게 한다. */
    freezeSession();                          /* ★ 현재 세션 전사를 '겹침 제거'하며 확정 저장(유실·중복 둘 다 방지) */
    /* 소리/단어가 전혀 안 들어온 채로 세션이 자꾸 끊기면 = 인식이 동작하지 않는 환경
       (카카오톡·네이버 인앱 브라우저 등). 계속 재시도하면 권한 창만 반복해서 뜨므로 빨리 안내하고 멈춘다. */
    if (running && !userStopping && !FAILED && !allSpoken().length && !heardSpeech) {
      webNoProg++;
      if (webNoProg >= 3) {
        $('lv').classList.remove('listening');
        var msg = isInAppBrowser()
          ? '이 앱(카카오톡·네이버 등) 안에서는 음성 낭독이 동작하지 않아요. 오른쪽 위 메뉴(⋮/공유)에서 <b>Chrome</b> 또는 <b>Safari로 열기</b>를 눌러 다시 해 주세요.'
          : (isMobile()
             ? '이 브라우저에서는 음성인식이 동작하지 않아요. <b>Chrome</b>(안드로이드) 또는 <b>Safari</b>(아이폰)에서 열어 주세요.'
             : '음성인식이 시작되지 않았어요. 브라우저의 마이크 권한을 확인해 주세요.');
        $('stat').innerHTML = '<span style="color:#b23">' + msg + '</span>';
        failParent('web_unsupported', 'no speech engine (noProg)');
        return;
      }
    }
    if (running && !userStopping && !FAILED && resumeCount < MAX_RESUME) {
      resumeCount++;
      try { webRec.start(); }
      catch(e){ setTimeout(function(){ try { webRec.start(); } catch(_){ if(allSpoken().length){ stopRec(true); render(); } } }, 250); }
      return;
    }
    if (userStopping) return;                 /* stopRec가 채점(render)을 처리 */
    if (allSpoken().length) { stopRec(true); render(); }   /* 재시도 한계 등으로 끝나도 읽은 건 채점 */
  };

  try { webRec.start(); }
  catch(e){ failParent('start_failed', String(e)); return; }

  running = true; startedAt = Date.now(); lastSegAt = Date.now();
  var words = String(CFG.ref || '').split(/\s+/).filter(Boolean).length;
  capMs = Math.min(RA_CAP_MAX, Math.max(RA_CAP_MIN, words * RA_MS_PER_WORD * RA_CAP_FACTOR + 30000));
  $('btnRec').textContent = '■ 다 읽었어요'; $('btnRec').classList.add('rec');
  $('stat').textContent = '듣고 있어요… 지문을 소리 내어 읽어 주세요. (무료 모드)';
  armDeafWatch();
  startCapWatch();
}

/* 무료 엔진 채점: 지문 단어를 순서대로 훑으며, 학생이 말한 토큰에서 순차적으로 찾는다(그리디 정렬).
   찾은 비율 = 읽기 일치율(완독률). 못 찾은 단어는 '빠진 단어'로 표시·전송. */
function aggregateWeb(){
  var refRaw = String(CFG.ref||'').split(/\s+/).filter(Boolean);
  var ref = refRaw.map(function(w){ return { orig:w, norm:normWord(w) }; }).filter(function(x){ return x.norm; });
  /* 공용 관대 정렬기(alignWeb)로 채점 — 철자 1자 차이·앞부분 일치도 맞은 것으로 본다. */
  var sp = allSpoken();
  var a = alignWeb(sp);
  var lastRefHit = a.lastRefHit, matched = a.matched;
  var wordsOut = [];
  for (var i=0;i<ref.length;i++){
    if (a.ok[i]) wordsOut.push({ Word:ref[i].orig, ok:true });
    else wordsOut.push({ Word:ref[i].orig, ok:false, unread:(lastRefHit<0 || i>lastRefHit) });
  }
  /* 마지막 매칭 뒤(아직 안 읽은 뒤부분)만 '빗금'. 중간 미매칭은 받아쓰기 오류로 보고 벌하지 않는다. */
  var completeness = ref.length ? Math.round(matched/ref.length*100) : 0;
  var reachedPct   = ref.length ? Math.round((lastRefHit+1)/ref.length*100) : 0;  // 끝까지 읽었는지(진행률)
  return { completeness:completeness, reachedPct:reachedPct, matched:matched, lastRefHit:lastRefHit,
           refWordCount:ref.length, spokenWordCount:sp.length, words:wordsOut, seconds:elapsed() };
}
function renderWeb(){
  if (!allSpoken().length) {
    $('stat').innerHTML = '<span style="color:#b23">인식된 말이 없습니다. 마이크 입력을 확인하고 다시 시도해 주세요.</span>';
    failParent('no_speech', 'empty web result');
    return;
  }
  var r = aggregateWeb();
  /* 무료 모드 통과 조건(두 가지 모두 충족해야 함):
       ① 끝까지 읽었나   → 진행률(reachedPct) ≥ RA_WEB_FINISH (앞부분만 읽고 멈추는 것을 막는다)
       ② 제대로 읽었나   → 전체 지문 대비 제대로 읽은 비율(completeness) ≥ RA_WEB_MIN
     화면 점수는 '제대로 읽은 %'(completeness)로 보여 준다(진행률로 부풀리지 않는다). */
  var correct  = r.completeness;      // 전체 지문 중 '제대로 읽은' 비율
  var reached  = r.reachedPct;        // 어디까지 도달했나(끝까지 읽었는지)
  var finished   = reached >= RA_WEB_FINISH;
  var exhausted  = azTries >= MAX_AZ_TRIES;              // 낭독 3회를 모두 사용
  var passQuality= finished && correct >= RA_WEB_MIN;
  var pass       = passQuality || exhausted;            // 3번까지 읽었으면 기준 미달이어도 통과
  r.pass = pass; r.score = correct; r.finished = finished;
  $('sPron').textContent = correct;  $('sAcc').textContent = correct;
  $('sFlu').textContent = correct;   $('sCom').textContent = correct;
  /* 표시: 맞은 단어는 초록. '읽었지만 받아쓰기가 틀린' 중간 단어는 평범하게(빗금 X).
     마지막으로 읽은 지점 뒤(아직 안 읽은 부분)만 연하게 표시한다. */
  $('words').innerHTML = r.words.map(function(w){
    var cls = w.ok ? 'w-ok' : (w.unread ? 'w-om' : '');
    return cls ? ('<span class="'+cls+'">'+(w.Word||'')+'</span>') : (w.Word||'');
  }).join(' ');
  $('raw').textContent = JSON.stringify({ engine:'web', 제대로읽음:correct, 진행률:reached, 끝까지:finished, 통과:pass,
    기준_정확:RA_WEB_MIN, 기준_끝까지:RA_WEB_FINISH, 맞은단어:r.matched, 지문단어:r.refWordCount, 말한단어:r.spokenWordCount, seconds:r.seconds }, null, 1);
  $('cardRes').style.display = 'block';
  /* 통과해야만 제출 버튼이 보인다. 미달이면 숨겨서 '이어 읽기'나 '처음부터 다시'로 끝까지·또박또박 읽게 한다. */
  if ($('btnSend')) { $('btnSend').style.display = pass ? '' : 'none'; if(pass){ $('btnSend').disabled=false; $('btnSend').style.opacity=''; $('btnSend').textContent='이 결과로 제출하기 →'; } }   /* 무료는 발음연습 없음 → 통과 시 바로 제출 */
  if (passQuality) {
    $('stat').textContent = (window.__autoNote__ ? (window.__autoNote__+' ') : '')
      + '잘 읽었어요! 완료(무료) — 제대로 읽기 ' + correct + '% · ' + r.seconds + '초';
  } else if (pass) {              // 3회 소진 → 통과(기준 미달이어도)
    $('stat').innerHTML = '<span style="color:#1f6b3f">끝까지 열심히 읽었어요! 👍 (낭독 ' + MAX_AZ_TRIES + '번 완료) '
      + '아래 「이 결과로 제출하기」로 다음으로 넘어가요.</span>';
  } else if (!finished) {
    var left = Math.max(0, r.refWordCount - 1 - r.lastRefHit);
    $('stat').innerHTML = '<span style="color:#b23">아직 끝까지 안 읽었어요 — 뒤쪽 약 ' + left + '단어가 남았어요. '
      + '「▶ 멈춘 곳부터 이어 읽기」로 끝까지 읽어 주세요.</span>' + azLeftNote();
  } else {
    $('stat').innerHTML = '<span style="color:#b45309">끝까지 읽었어요! 또박또박 한 번 더 읽어 볼까요? '
      + '지금 제대로 읽은 게 ' + correct + '% (기준 ' + RA_WEB_MIN + '%) — 「🎤 처음부터 다시」' + azLeftNote() + '</span>';
  }
  window.__autoNote__ = '';
  window.__LASTWEB__ = r;
  if (allSpoken().length && !FAILED) $('btnMore').style.display = '';   /* 멈춘 곳부터 이어 읽기 제공(아직 기준 미달이어도 더 읽어 채울 수 있게) */
}

function elapsed(){ return Math.round((Date.now()-startedAt)/1000); }

/* ▶ 멈춘 곳부터 이어 읽기 — 이미 읽은 segs/webTokens 는 그대로 두고 인식만 다시 켜서 이어 쌓는다.
   (처음부터 다시 읽을 필요 없이, 쉬었다가 멈춘 지점부터 계속 → 점수도 합산된다.) */
function resumeMore(){
  if (running) return;
  if (CFG.engine !== 'web' && !segs.length) return;        /* 이어 읽을 앞부분이 있어야 한다(azure) */
  if (!azTryGate()) return;             /* (Azure) 이어 읽기도 새 녹음이므로 횟수에 포함 */
  FAILED = false;
  $('cardRes').style.display = 'none';
  $('btnMore').style.display = 'none';
  $('btnSkip').style.display = 'none';
  $('stat').textContent = '마이크 확인 중…';
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    D.mic = true; drawDiag(); startLevelMeter(stream);
    if (CFG.engine === 'web') beginWebRecognition(); else beginRecognition();   /* begin* 은 segs/webTokens 를 지우지 않는다 → 이어 쌓임 */
    $('stat').textContent = '이어서 읽어 주세요 — 멈춘 곳부터 계속하면 됩니다. (다 읽으면 ■)';
  }).catch(function(err){
    D.mic = false; drawDiag();
    failParent('mic_denied', err && err.name);
  });
}

function stopRec(silent){
  userStopping = true;                 // 이 시점 이후의 취소 이벤트로는 이어듣기를 하지 않는다
  clearInterval(capTimer);             // 상한 감시 종료(오디오 과금 중단)
  clearTimeout(window.__deaf__);
  if (CFG.engine === 'web') {          /* 무료 엔진 종료 */
    if (webRec == null && !running) return;
    running = false;
    /* 멈추는 순간 아직 확정 안 된 마지막 말(interim)을 잃지 않도록 먼저 저장 */
    freezeSession();   /* 멈추는 순간 현재 세션 전사를 겹침 제거하며 확정 저장(마지막 말 유실·중복 방지) */
    $('btnRec').textContent = '채점 중…'; $('btnRec').classList.remove('rec'); $('btnRec').disabled = true;
    stopLevelMeter(); $('lv').classList.remove('listening');
    /* 멈추기 전에 모든 핸들러를 떼어낸다 — 종료 후 늦게 오는 결과/종료 이벤트가
       자동 재시작을 걸거나 "읽는 중…"으로 화면을 되돌려 멈춘 것처럼 보이게 하는 것을 막는다. */
    if (webRec) { try { webRec.onresult = null; webRec.onerror = null; webRec.onend = null; webRec.onspeechend = null; } catch(e){} }
    try { if (webRec) webRec.stop();  } catch(e){}
    try { if (webRec) webRec.abort(); } catch(e){}   /* 확실히 종료(과금 없음·마이크 해제) */
    webRec = null;
    if (!silent) render();
    $('btnRec').disabled = false; $('btnRec').textContent = '🎤 처음부터 다시';
    return;
  }
  if (!recognizer) return;             /* 정밀(azure) 엔진 종료 */
  running = false;
  $('btnRec').textContent = '채점 중…'; $('btnRec').classList.remove('rec'); $('btnRec').disabled = true;
  stopLevelMeter();
  recognizer.stopContinuousRecognitionAsync(function(){
    try { recognizer.close(); } catch(e){}
    recognizer = null;
    if (!silent) render();
    $('btnRec').disabled = false; $('btnRec').textContent = '🎤 처음부터 다시';
  }, function(){ $('btnRec').disabled = false; $('btnRec').textContent = '🎤 처음부터 다시'; });
}

/* ---------- 구간 결과 합산 ---------- */
function aggregate(){
  var words = [], fluSum = 0, fluW = 0;
  segs.forEach(function(nb){
    var ws = nb.Words || [];
    ws.forEach(function(w){ words.push(w); });
    var f = nb.PronunciationAssessment && nb.PronunciationAssessment.FluencyScore;
    if (typeof f === 'number') { fluSum += f * Math.max(1, ws.length); fluW += Math.max(1, ws.length); }
  });
  var refN = CFG.ref.split(/\s+/).filter(Boolean).length;
  var scored = words.filter(function(w){
    var t = w.PronunciationAssessment && w.PronunciationAssessment.ErrorType;
    return t !== 'Omission' && t !== 'Insertion';
  });
  var accSum = scored.reduce(function(a,w){
    return a + ((w.PronunciationAssessment && w.PronunciationAssessment.AccuracyScore) || 0); }, 0);
  var accuracy = scored.length ? accSum/scored.length : 0;
  var fluency  = fluW ? fluSum/fluW : 0;
  var completeness = refN ? Math.min(100, scored.length / refN * 100) : 0;
  /* Azure 종합점수 가중치와 같은 비율(정확 0.6 · 유창 0.2 · 완독 0.2) */
  var pron = accuracy*0.6 + fluency*0.2 + completeness*0.2;
  return { accuracy:accuracy, fluency:fluency, completeness:completeness, pron:pron,
           words:words, refWordCount:refN, spokenWordCount:scored.length, seconds:elapsed() };
}

function render(){
  if (CFG.engine === 'web') { renderWeb(); return; }   /* 무료 엔진은 별도 채점 */
  if (!segs.length) {
    $('stat').innerHTML = '<span style="color:#b23">인식된 말이 없습니다. 마이크 입력을 확인하고 다시 시도해 주세요.</span>';
    failParent('no_speech', 'empty result');   /* 다시 시도해도 되고, 그냥 진행해도 된다 */
    return;
  }
  var r = aggregate();
  var R = function(x){ return Math.round(x); };
  $('sPron').textContent = R(r.pron);  $('sAcc').textContent = R(r.accuracy);
  $('sFlu').textContent = R(r.fluency); $('sCom').textContent = R(r.completeness);

  $('words').innerHTML = r.words.map(function(w){
    var p = w.PronunciationAssessment || {}, t = p.ErrorType, a = p.AccuracyScore || 0;
    var cls = (t === 'Omission') ? 'w-om' : (t && t !== 'None') ? 'w-bad'
            : (a < 60) ? 'w-bad' : (a < 80) ? 'w-mid' : 'w-ok';
    return '<span class="'+cls+'" title="'+R(a)+'">'+ (w.Word||'') +'</span>';
  }).join(' ');

  $('raw').textContent = JSON.stringify({ scores:{
      pron:R(r.pron), accuracy:R(r.accuracy), fluency:R(r.fluency), completeness:R(r.completeness)
    }, seconds:r.seconds, refWordCount:r.refWordCount, spokenWordCount:r.spokenWordCount,
    segments:segs.length }, null, 1);

  $('cardRes').style.display = 'block';

  /* 통과 규칙(무료와 통일): 끝까지 읽었고(완독률≥기준) + 종합≥70 → 통과.
     3번까지 읽었으면(횟수 소진) 종합 70 미만이어도 통과시킨다(관문에 갇히지 않게). */
  var finished   = R(r.completeness) >= RA_WEB_FINISH;
  var exhausted  = azTries >= MAX_AZ_TRIES;
  var passQuality= finished && R(r.pron) >= RA_WEB_MIN;
  var pass       = passQuality || exhausted;
  if ($('btnSend')) $('btnSend').style.display = pass ? '' : 'none';

  var an = window.__autoNote__ ? (escapeHtml(window.__autoNote__) + ' ') : '';   // 자동 제출(방치·최대시간) 안내를 모든 경우에 함께 표시
  if (passQuality) {
    $('stat').innerHTML = an + '잘 읽었어요! 완료 — 종합 ' + R(r.pron) + '점 · ' + r.seconds + '초';
  } else if (pass) {               // 3회 소진 → 통과
    $('stat').innerHTML = an + '<span style="color:#1f6b3f">끝까지 열심히 읽었어요! 👍 (낭독 ' + MAX_AZ_TRIES + '번 완료) '
      + '아래 「이 결과로 제출하기」로 다음으로 넘어가요.</span>';
  } else if (!finished) {
    $('stat').innerHTML = an + '<span style="color:#b23">아직 끝까지 안 읽었어요 — 「▶ 멈춘 곳부터 이어 읽기」로 끝까지 읽어 주세요.</span>' + azLeftNote();
  } else {
    $('stat').innerHTML = an + '<span style="color:#b45309">끝까지 읽었어요! 또박또박 한 번 더 — 지금 종합 ' + R(r.pron) + '점 (기준 ' + RA_WEB_MIN + ') · 「🎤 처음부터 다시」' + azLeftNote() + '</span>';
  }
  window.__autoNote__ = '';
  window.__LAST__ = r;
  if (pass) renderClinic(r);       /* 🎯 통과했을 때만 '발음 콕 집어 연습' 노출 */
  else { var _pc=$('praClinic'); if(_pc){ _pc.style.display='none'; _pc.innerHTML=''; } }
  /* 멈춘 곳부터 이어 읽기 — 녹음 횟수가 남아 있을 때만 제공(상한 넘으면 숨김) */
  if (segs.length && !FAILED && azTries < MAX_AZ_TRIES) $('btnMore').style.display = '';
}

/* ═══════════ 🎯 발음 콕 집어 연습 ═══════════════════════════════════════════
   낭독(Azure) 결과에서 약했던 단어를 모아, 올바른 발음을 '들려주고'(무료 브라우저 음성)
   그 단어만 '다시 읽어' Azure로 재채점한다. 단어 중심 MVP.                      */
function speakWord(w){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(String(w||''));
    u.lang='en-US'; u.rate=0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function pickWeakWords(r){
  var out=[];
  var ws=(r && r.words) ? r.words : [];
  for(var i=0;i<ws.length;i++){
    var w=ws[i], p=w.PronunciationAssessment||{}, t=p.ErrorType, a=(p.AccuracyScore!=null?p.AccuracyScore:100);
    if(t==='Insertion' || t==='Omission') continue;  // 덧붙임·건너뜀(안 읽음)은 발음 연습 대상 아님(완독률 관문이 처리)
    var word=String(w.Word||'').replace(/[^A-Za-z'’\-]/g,'');
    if(!word) continue;
    if(t==='Mispronunciation' || a<PRA_PASS) out.push({ word:word, score:Math.round(a), type:t||'' });   // 실제로 읽었는데 약한 단어만
  }
  /* 점수 낮은 순으로 최대 6개 */
  out.sort(function(x,y){ return x.score-y.score; });
  return out.slice(0,6);
}
/* 제출 버튼 잠금/해제 — 발음연습을 끝내야 제출(통과)할 수 있다. */
function praGateSubmit(ok){
  var b=$('btnSend'); if(!b) return;
  b.disabled=!ok; b.style.opacity = ok ? '' : '.45'; b.style.cursor = ok ? '' : 'not-allowed';
  b.textContent = ok ? '이 결과로 제출하기 →' : '🎤 먼저 발음 연습을 끝내요';
}
function praProgressLine(){
  var el=$('praProg'); if(!el) return;
  var totalWords = box_praRowCount();
  var done = totalWords - praTodo;
  if(praComplete){ el.innerHTML='<b style="color:#1f7a3d">✅ 발음 연습 완료!</b> 아래 「이 결과로 제출하기」로 넘어가세요.'; }
  else { el.innerHTML='연습 완료: <b>'+done+' / '+totalWords+'</b> 단어 · 약한 단어를 모두 연습하면 제출할 수 있어요.'; }
}
function box_praRowCount(){ var b=$('praClinic'); return b ? b.querySelectorAll('.pra-row').length : 0; }
/* 한 단어의 연습 기록을 praLog에 반영(선생님 보고용) */
function praLogUpsert(word, base, best, tries, passed){
  for(var i=0;i<praLog.length;i++){ if(praLog[i].word===word){ praLog[i].best=best; praLog[i].tries=tries; praLog[i].passed=passed; return; } }
  praLog.push({ word:word, base:base, best:best, tries:tries, passed:passed });
}
/* 발음연습 완료 판정 — 모든 약한 단어가 '완료'거나, 세션 녹음 상한에 도달하면 통과 */
function praRecheckComplete(){
  if(praRecs>=PRA_MAX_RECS){   // 세션 상한 소진 → 통과(남은 단어는 '시도함'으로 마감)
    var rows=$('praClinic').querySelectorAll('.pra-row');
    for(var i=0;i<rows.length;i++){ if(rows[i].getAttribute('data-done')!=='1'){ praMarkDone(rows[i], false); } }
  }
  if(praTodo<=0){ praComplete=true; praGateSubmit(true); }
  praProgressLine();
}
function praMarkDone(row, passed){
  if(row.getAttribute('data-done')==='1') return;
  row.setAttribute('data-done','1');
  praTodo = Math.max(0, praTodo-1);
  var recBtn=row.querySelector('.pra-rec'); if(recBtn){ recBtn.disabled=true; recBtn.style.opacity='.5'; }
}

function renderClinic(r){
  var box=$('praClinic'); if(!box) return;
  praComplete=false; praTodo=0; praLog=[];
  if(CFG.engine!=='azure'){ box.style.display='none'; box.innerHTML=''; praComplete=true; praGateSubmit(true); return; }
  var weak=pickWeakWords(r);
  if(!weak.length){   // 더 연습할 단어 없음 → 바로 통과
    box.style.display='block';
    box.innerHTML='<div style="margin-top:14px;padding:12px;border:1px solid #d6e9dc;background:#f1faf4;border-radius:10px;color:#1f6b3f;font-weight:700">🎉 또렷하게 잘 읽었어요! 특별히 더 연습할 단어가 없어요.</div>';
    praComplete=true; praGateSubmit(true); return;
  }
  praTodo = weak.length;
  var h='<div style="margin-top:16px;border-top:1px dashed #d8dfe6;padding-top:12px">';
  h+='<div style="font-weight:800;color:#8a4b00;margin-bottom:4px">🎯 발음 콕 집어 연습 <span style="font-size:.72rem;background:#fde8c8;color:#8a4b00;border-radius:6px;padding:1px 6px;vertical-align:middle">필수</span></div>';
  h+='<div style="font-size:.84rem;color:#7b8794;margin-bottom:6px">약했던 단어예요. <b>🔊 듣기</b>로 올바른 소리를 듣고, <b>🎤 다시 읽기</b>로 그 단어만 또박또박 읽어 보세요.</div>';
  h+='<div style="font-size:.8rem;color:#8a4b00;background:#fff7ed;border:1px solid #f0d9b5;border-radius:8px;padding:8px 10px;margin-bottom:10px">📋 <b>연습 내용은 선생님께 그대로 보고돼요.</b> 또박또박 성실히 읽어 주세요 — 대충 넘기면 선생님이 바로 알 수 있어요.</div>';
  for(var i=0;i<weak.length;i++){
    var wd=weak[i].word, sc=weak[i].score;
    var hint = (i===0) ? '<span style="font-size:.72rem;color:#b45309;margin-left:4px">여기부터 해볼까요?</span>' : '';
    h+='<div class="pra-row" data-word="'+escapeHtml(wd)+'" data-base="'+sc+'" data-tries="0" data-best="'+sc+'" data-done="0" '
      +'style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #eef2f6">'
      +'<span style="font-weight:800;font-size:1.05rem;min-width:84px">'+escapeHtml(wd)+'</span>'
      +'<span class="pra-base" style="font-size:.82rem;color:#b23">처음 '+sc+'점</span>'+hint
      +'<span style="flex:1"></span>'
      +'<button type="button" class="pra-listen" style="border:1.5px solid #c7d2da;background:#fff;color:#2e6b4f;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer">🔊 듣기</button>'
      +'<button type="button" class="pra-rec" style="border:none;background:#2e6b4f;color:#fff;border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer">🎤 다시 읽기</button>'
      +'<span class="pra-result" style="min-width:118px;font-weight:800"></span>'
      +'</div>';
  }
  h+='<div id="praProg" style="font-size:.84rem;color:#55606e;margin-top:10px;font-weight:700"></div>';
  h+='<div class="pra-note" style="font-size:.76rem;color:#8a93a0;margin-top:6px">한 단어를 '+PRA_PER_WORD+'번 소리 내어 읽거나 기준(' + PRA_PASS + '점)을 넘으면 그 단어는 완료돼요. 소리를 안 내면 횟수로 안 쳐요.</div>';
  h+='</div>';
  box.innerHTML=h; box.style.display='block';
  var rows=box.querySelectorAll('.pra-row');
  for(var k=0;k<rows.length;k++){ (function(row){
    var word=row.getAttribute('data-word');
    row.querySelector('.pra-listen').addEventListener('click', function(){ speakWord(word); });
    row.querySelector('.pra-rec').addEventListener('click', function(){ practiceWord(row); });
    praLogUpsert(word, Number(row.getAttribute('data-base')||0), Number(row.getAttribute('data-base')||0), 0, false);
  })(rows[k]); }
  praGateSubmit(false);   // 연습 끝낼 때까지 제출 잠금(의무)
  praProgressLine();
}
/* 단어 하나만 녹음해 Azure로 재채점(recognizeOnceAsync — 짧은 발화에 적합).
   비용 안전: 초기 침묵 짧게 + 녹음당 강제 종료(PRA_REC_MS) + 세션 상한(PRA_MAX_RECS). */
var praBusy=false;
function practiceWord(row){
  if(praBusy) return;
  if(!(SDK && SDK.SpeechConfig)) return;
  if(row.getAttribute('data-done')==='1') return;   // 이미 완료된 단어
  var word=row.getAttribute('data-word');
  var tries=Number(row.getAttribute('data-tries')||'0');   // '소리 낸' 시도 수
  var base=Number(row.getAttribute('data-base')||0);
  var best=Number(row.getAttribute('data-best')||0);
  var resEl=row.querySelector('.pra-result');
  var btn=row.querySelector('.pra-rec');
  if(praRecs>=PRA_MAX_RECS){ resEl.innerHTML='<span style="color:#1f7a3d">연습을 충분히 했어요 👍</span>'; praRecheckComplete(); return; }
  praBusy=true; praRecs++;                                  // 세션 상한은 '모든 시도'(무음 포함) 소진 → 비용 천장
  btn.disabled=true; resEl.innerHTML='<span style="color:#2e6b4f">🎤 지금 「'+escapeHtml(word)+'」 읽어요…</span>';
  var sc, rec, done=false;
  function finish(score){
    if(done) return; done=true; praBusy=false;
    clearTimeout(hardT);
    try{ rec.close(); }catch(e){}
    btn.disabled = (row.getAttribute('data-done')==='1') || (praRecs>=PRA_MAX_RECS);
    if(score==null){   // 무음/인식 실패 → '소리 낸 시도'로 안 침(횟수 보존). 비용(praRecs)은 이미 소진.
      resEl.innerHTML='<span style="color:#b23">잘 안 들렸어요 — 또박또박 한 번 더</span>';
      praRecheckComplete(); return;
    }
    tries += 1; row.setAttribute('data-tries', String(tries));   // 실제로 소리 낸 시도만 +1
    if(score>best){ best=score; row.setAttribute('data-best', String(best)); }
    var color = score>=PRA_PASS ? '#1f7a3d' : (score>=50 ? '#b45309' : '#b23');
    var mark  = score>=PRA_PASS ? ' 👍' : '';
    resEl.innerHTML='<span style="color:'+color+'">새 점수 '+score+'점'+mark+' <span style="color:#8a93a0;font-weight:400">('+tries+'/'+PRA_PER_WORD+')</span></span>';
    var passed = best>=PRA_PASS;
    if(passed){ var baseEl=row.querySelector('.pra-base'); if(baseEl) baseEl.style.color='#1f7a3d'; }
    praLogUpsert(word, base, best, tries, passed);
    /* 완료 판정: 기준 넘겼거나(향상) · 소리 낸 시도 3회 채움 */
    if(passed || tries>=PRA_PER_WORD){
      praMarkDone(row, passed);
      if(!passed) resEl.innerHTML='<span style="color:#b45309">연습함 — 아직 어려워요 (완료)</span>';
    }
    praRecheckComplete();
  }
  try{
    sc = makeSpeechConfig();
    try{ sc.setProperty(SDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs,'4000'); }catch(e){}  // 말 없으면 4초 내 종료
    try{ sc.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs,'700'); }catch(e){}
    var ac = SDK.AudioConfig.fromDefaultMicrophoneInput();
    rec = new SDK.SpeechRecognizer(sc, ac);
    var pa = new SDK.PronunciationAssessmentConfig(
      word, SDK.PronunciationAssessmentGradingSystem.HundredMark,
      SDK.PronunciationAssessmentGranularity.Phoneme, false);
    pa.applyTo(rec);
  }catch(e){ done=true; praBusy=false; btn.disabled=false; resEl.innerHTML='<span style="color:#b23">시작 실패</span>'; return; }
  var hardT=setTimeout(function(){ try{ rec.stopContinuousRecognitionAsync&&rec.stopContinuousRecognitionAsync(); }catch(e){} finish(null); }, PRA_REC_MS);  // 자리 비움·소음 과금 방지
  try{
    rec.recognizeOnceAsync(function(result){
      var score=null;
      try{
        var js=result.properties.getProperty(SDK.PropertyId.SpeechServiceResponse_JsonResult);
        var nb=JSON.parse(js).NBest[0];
        var w0=(nb.Words||[])[0];
        var a=(w0 && w0.PronunciationAssessment && w0.PronunciationAssessment.AccuracyScore);
        if(a==null) a=(nb.PronunciationAssessment && nb.PronunciationAssessment.AccuracyScore);
        if(a!=null) score=Math.round(a);
      }catch(e){}
      finish(score);
    }, function(err){ finish(null); });
  }catch(e){ finish(null); }
}

$('btnSend').addEventListener('click', function(){
  var payload;
  if (CFG.engine === 'web') {
    var w = window.__LASTWEB__; if (!w) return;
    if (w.pass === false) return;   /* 기준 미달은 제출 불가(버튼도 숨겨져 있음) — 다시 읽게 한다 */
    /* 무료 모드: 발음 질은 못 재므로 네 점수 모두 '제대로 읽은 비율'(completeness).
       '빠진 단어'는 받아쓰기 오류와 구분이 안 되므로, 실제로 '아직 안 읽은 뒤부분'만 기록한다. */
    var sc = (w.score != null) ? w.score : (w.completeness || 0);
    payload = {
      ok:true, engine:'web', label:CFG.label,
      pron:sc, accuracy:sc, fluency:sc, completeness:sc,
      seconds:w.seconds, refWordCount:w.refWordCount, spokenWordCount:w.spokenWordCount,
      weakWords:(w.words||[]).filter(function(x){ return x.unread; }).slice(0,8)
                  .map(function(x){ return { word:x.Word, score:0, type:'Omission' }; })
    };
  } else {
    var r = window.__LAST__; if (!r) return;
    if (!praComplete) return;   /* 발음연습 의무 — 끝내기 전엔 제출 불가(버튼도 잠겨 있음) */
    payload = {
      ok:true, engine:'azure', label:CFG.label,
      pron:Math.round(r.pron), accuracy:Math.round(r.accuracy),
      fluency:Math.round(r.fluency), completeness:Math.round(r.completeness),
      seconds:r.seconds, refWordCount:r.refWordCount, spokenWordCount:r.spokenWordCount,
      weakWords:(r.words||[]).filter(function(w){
          var p=w.PronunciationAssessment||{};
          return (p.ErrorType && p.ErrorType!=='None') || (p.AccuracyScore||100) < 60;
        }).slice(0,8).map(function(w){
          return { word:w.Word, score:Math.round((w.PronunciationAssessment||{}).AccuracyScore||0),
                   type:(w.PronunciationAssessment||{}).ErrorType||'' }; }),
      praLog: praLog.slice(0,12)   /* 발음연습 기록(선생님 보고용) */
    };
  }
  $('btnSend').textContent = '전송됨 ✓';
  if (REDIRECT) { returnToApp(payload); return; }   // 전체화면 모드: 앱으로 복귀하며 결과 전달
  if (D.opener) { try { window.opener.postMessage({type:'REC_RESULT', payload:payload}, parentOrigin||'*'); } catch(e){} }
  setTimeout(function(){ window.close(); }, 500);
});

/* ---------- 입력 레벨 미터(실제로 소리가 들어오는지 눈으로 확인) ---------- */
var actx = null, src = null, an = null;
function startLevelMeter(stream){
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    src = actx.createMediaStreamSource(stream);
    an = actx.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    var buf = new Uint8Array(an.frequencyBinCount);
    levelTimer = setInterval(function(){
      an.getByteTimeDomainData(buf);
      var peak = 0;
      for (var i=0;i<buf.length;i++){ var v = Math.abs(buf[i]-128)/128; if (v>peak) peak=v; }
      if (peak > 0.04) heardSpeech = true;   /* 실제 소리가 들어옴 → 무음 오판 방지(Azure 이벤트보다 확실) */
      $('lvBar').style.width = Math.min(100, peak*220) + '%';
    }, 80);
  } catch(e){}
}
function stopLevelMeter(){
  if (levelTimer) clearInterval(levelTimer); levelTimer = null;
  $('lvBar').style.width = '0';
  try { if (actx) actx.close(); } catch(e){}
}

/* 모든 상태변수·함수가 초기화된 뒤 실행 — iOS 전체화면 모드 감지(해시로 지문/토큰 받기). */
detectRedirect();
